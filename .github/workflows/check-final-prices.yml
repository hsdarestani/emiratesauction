name: Check production final prices
on:
  push:
    branches: [ops/check-final-prices]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production workers over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          script: |
            set -u
            cd /opt/emiratesauction
            echo '=== DATA QUALITY ==='
            curl -fsS http://127.0.0.1:8087/api/data-quality || true
            echo
            echo '=== COMPOSE ==='
            docker compose ps || true
            echo '=== WORKER STATE ==='
            docker inspect emiratesauction-worker-1 --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} RestartCount={{.RestartCount}}' || true
            echo '=== CLOSING WORKER STATE ==='
            docker inspect emiratesauction-closing-worker-1 --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} RestartCount={{.RestartCount}}' || true
            echo '=== WORKER LOG ==='
            docker compose logs --tail=120 worker || true
            echo '=== CLOSING WORKER LOG ==='
            docker compose logs --tail=120 closing-worker || true
            echo '=== REDIS INFO ==='
            docker compose exec -T redis redis-cli INFO memory | grep -E 'used_memory_human|maxmemory_human|maxmemory_policy' || true
