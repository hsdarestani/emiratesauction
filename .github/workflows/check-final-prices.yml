name: Check production final prices
on:
  push:
    branches: [ops/check-final-prices]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production data over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          script: |
            set -e
            cd /opt/emiratesauction
            echo '=== DATA QUALITY ==='
            curl -fsS http://127.0.0.1:8087/api/data-quality
            echo
            echo '=== CLOSED AUCTIONS SUMMARY ==='
            curl -fsS http://127.0.0.1:8087/api/auctions/closed | python3 -c '
            import json,sys
            rows=json.load(sys.stdin)
            print("closed_count=", len(rows))
            filled=[r for r in rows if r.get("final_bid") not in (None,0)]
            empty=[r for r in rows if r.get("final_bid") in (None,0)]
            print("final_bid_filled=", len(filled))
            print("final_bid_empty=", len(empty))
            print("examples_filled=")
            for r in filled[:10]:
                print(r.get("lot_id"), r.get("title"), r.get("final_bid"), r.get("status"), r.get("price_data_valid"))
            print("examples_empty=")
            for r in empty[:10]:
                print(r.get("lot_id"), r.get("title"), r.get("final_bid"), r.get("status"), r.get("price_data_valid"))
            '
            echo '=== SERVER MEMORY ==='
            free -h
            echo '=== CONTAINERS ==='
            docker compose ps
