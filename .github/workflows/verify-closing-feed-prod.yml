name: Verify closing feed production
on:
  push:
    branches: [ops/verify-closing-feed-prod]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production closing feed result
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/emiratesauction
            docker compose exec -T backend python - <<'PY'
            from sqlalchemy import select
            from app.database import SessionLocal
            from app.models import Vehicle
            with SessionLocal() as db:
                rows=db.scalars(select(Vehicle).where(
                    Vehicle.price_source.in_(("emirates_live_api_closing_feed","closing_feed_monitoring_gap"))
                ).order_by(Vehicle.finished_at.desc().nullslast()).limit(10)).all()
                print('closing_feed_results=',len(rows))
                for v in rows:
                    print(v.lot_id, v.title, 'status=',v.status, 'valid=',v.price_data_valid, 'source=',v.price_source, 'gap=',v.monitoring_gap_seconds, 'bid=',v.last_live_bid, 'seen=',v.last_live_bid_at, 'finished=',v.finished_at, 'end=',v.auction_end_time)
            PY
