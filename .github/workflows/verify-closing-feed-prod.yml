name: Verify closing feed production
on:
  push:
    branches: [ops/verify-closing-feed-prod]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production closing feed
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/emiratesauction
            echo '=== COMPOSE ==='
            docker compose ps
            echo '=== CLOSING FEED DIRECT RUN ==='
            docker compose exec -T backend python - <<'PY'
            from app.worker import poll_closing_feed
            print(poll_closing_feed.run())
            PY
            echo '=== CLOSING CANDIDATES ==='
            docker compose exec -T backend python - <<'PY'
            from datetime import datetime, timedelta, timezone
            from sqlalchemy import select
            from app.database import SessionLocal
            from app.models import Vehicle
            now=datetime.now(timezone.utc)
            with SessionLocal() as db:
                rows=db.scalars(select(Vehicle).where(
                    Vehicle.is_tracked.is_(True),
                    Vehicle.status.in_(("active","ending")),
                    Vehicle.auction_end_time.is_not(None),
                    Vehicle.auction_end_time <= now+timedelta(minutes=5),
                ).order_by(Vehicle.auction_end_time).limit(20)).all()
                print('count=',len(rows))
                for v in rows:
                    print(v.lot_id, v.title, 'end=',v.auction_end_time, 'bid=',v.last_live_bid, 'seen=',v.last_live_bid_at, 'status=',v.status)
            PY
            echo '=== CLOSED ==='
            curl -fsS http://127.0.0.1:8087/api/auctions/closed | python3 -c 'import json,sys; r=json.load(sys.stdin); print("closed_count=",len(r)); [print(x.get("lot_id"),x.get("title"),x.get("final_bid"),x.get("price_data_valid")) for x in r[:10]]'
            echo '=== WORKER LOG TAIL ==='
            docker compose logs --tail=80 closing-worker beat
