name: Production emergency recovery
on:
  push:
    branches: [ops/prod-recovery]

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Relieve memory pressure and recover web service
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -u
            cd /opt/emiratesauction
            echo '=== BEFORE ==='
            uptime || true
            free -h || true
            docker compose ps || true

            echo 'Stopping background auction workers temporarily to free RAM'
            docker compose stop worker closing-worker beat || true
            sleep 2

            echo 'Resetting ephemeral Celery Redis state'
            docker compose restart redis || true
            sleep 3
            docker compose exec -T redis redis-cli FLUSHDB || true

            echo 'Ensuring web stack is alive'
            docker compose up -d --no-build postgres redis backend frontend
            systemctl restart nginx
            sleep 5

            echo '=== HEALTH ==='
            free -h || true
            uptime || true
            curl -fsS -m 10 http://127.0.0.1:8087/ >/dev/null && echo 'frontend=OK' || echo 'frontend=FAIL'
            curl -fsS -m 10 http://127.0.0.1:8087/api/health && echo || true
            curl -kfsS -m 10 --resolve emiratesauction.smarbiz.sbs:443:127.0.0.1 https://emiratesauction.smarbiz.sbs/ >/dev/null && echo 'https=OK' || echo 'https=FAIL'
            docker compose ps || true
