name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script: |
            mkdir -p /opt
            if [ ! -d /opt/emiratesauction/.git ]; then git clone https://github.com/hsdarestani/emiratesauction.git /opt/emiratesauction; fi
            bash /opt/emiratesauction/deploy/deploy.sh

