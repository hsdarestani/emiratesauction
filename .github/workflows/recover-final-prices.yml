name: Recover production final prices
on:
  push:
    branches: [ops/recover-final-prices]

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Reset broker backlog and recover prices
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/emiratesauction
            echo '=== BEFORE ==='
            docker compose ps
            docker compose exec -T backend python - <<'PY'
            from datetime import datetime, timedelta, timezone
            from sqlalchemy import func, select
            from app.database import SessionLocal
            from app.models import Vehicle
            now=datetime.now(timezone.utc)
            with SessionLocal() as db:
                total=db.scalar(select(func.count()).select_from(Vehicle).where(Vehicle.status=='finished_unreliable')) or 0
                recent=db.scalar(select(func.count()).select_from(Vehicle).where(Vehicle.status=='finished_unreliable', Vehicle.finished_at>=now-timedelta(hours=48))) or 0
                oldest=db.scalar(select(func.min(Vehicle.finished_at)).where(Vehicle.status=='finished_unreliable'))
                newest=db.scalar(select(func.max(Vehicle.finished_at)).where(Vehicle.status=='finished_unreliable'))
                print('unreliable_total=', total)
                print('unreliable_last48h=', recent)
                print('oldest=', oldest)
                print('newest=', newest)
            PY

            echo '=== RESET REDIS BROKER STATE ==='
            docker compose stop worker closing-worker beat
            docker compose exec -T redis redis-cli FLUSHDB
            docker compose up -d worker closing-worker beat
            sleep 8
            docker compose ps
            docker compose exec -T redis redis-cli INFO memory | grep -E 'used_memory_human|maxmemory_human|maxmemory_policy'

            echo '=== TRIGGER RECOVERY ==='
            docker compose exec -T backend python - <<'PY'
            from app.worker import dispatch_unreliable_recovery
            print('queued=', dispatch_unreliable_recovery())
            PY
            sleep 25

            echo '=== AFTER 25s ==='
            curl -fsS http://127.0.0.1:8087/api/data-quality
            echo
            curl -fsS http://127.0.0.1:8087/api/auctions/closed | python3 -c 'import json,sys; r=json.load(sys.stdin); print("closed_count=",len(r)); print("with_final_bid=",sum(1 for x in r if x.get("final_bid"))) ; [print(x.get("lot_id"),x.get("title"),x.get("final_bid")) for x in r[:10]]'
            echo '=== WORKER STATUS ==='
            docker compose ps
