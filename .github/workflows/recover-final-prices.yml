name: Probe legacy final prices
on:
  push:
    branches: [ops/recover-final-prices]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test official Emirates detail for historical records
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/emiratesauction
            docker compose exec -T backend python - <<'PY'
            from sqlalchemy import select
            from app.database import SessionLocal
            from app.models import Vehicle
            from app.scraper import fetch_detail, normalize

            with SessionLocal() as db:
                rows = db.scalars(
                    select(Vehicle)
                    .where(Vehicle.status == 'historical_unreliable')
                    .order_by(Vehicle.auction_end_time.desc().nullslast(), Vehicle.updated_at.desc())
                    .limit(8)
                ).all()
                print('sample_count=', len(rows))
                for v in rows:
                    try:
                        detail = fetch_detail(v.lot_id)
                        payload = normalize({}, detail)
                        print('LOT', v.lot_id, '|', v.title, '| local=', v.current_bid, '| official_status=', payload.get('status'), '| official_price=', payload.get('current_bid'), '| end=', payload.get('auction_end_time'))
                    except Exception as e:
                        print('LOT', v.lot_id, '| ERROR', type(e).__name__, str(e)[:200])
            PY
