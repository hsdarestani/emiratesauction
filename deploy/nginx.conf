server {
  listen 80;
  server_name emiratesauction.smarbiz.sbs;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name emiratesauction.smarbiz.sbs;
  ssl_certificate /etc/letsencrypt/live/emiratesauction.smarbiz.sbs/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/emiratesauction.smarbiz.sbs/privkey.pem;
  location / { proxy_pass http://127.0.0.1:8087; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
}

