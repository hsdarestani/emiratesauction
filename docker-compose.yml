services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U auction], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 224m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DATABASE_URL: postgresql+psycopg2://auction:${POSTGRES_PASSWORD:-auction-change-me}@postgres:5432/auction
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EUR_AED_RATE: ${EUR_AED_RATE:-4.30}
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: ./backend
    command: celery -A app.worker.celery worker -Q celery,live,finalize --pool=threads --concurrency=6 --prefetch-multiplier=1 --without-gossip --without-mingle --loglevel=info
    restart: unless-stopped
    mem_limit: 320m
    environment:
      DATABASE_URL: postgresql+psycopg2://auction:${POSTGRES_PASSWORD:-auction-change-me}@postgres:5432/auction
      REDIS_URL: redis://redis:6379/0
      EUR_AED_RATE: ${EUR_AED_RATE:-4.30}
    depends_on: [backend, redis]
  closing-worker:
    build: ./backend
    command: celery -A app.worker.celery worker -Q closing --pool=threads --concurrency=8 --prefetch-multiplier=1 --without-gossip --without-mingle --loglevel=info
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql+psycopg2://auction:${POSTGRES_PASSWORD:-auction-change-me}@postgres:5432/auction
      REDIS_URL: redis://redis:6379/0
      EUR_AED_RATE: ${EUR_AED_RATE:-4.30}
    depends_on: [backend, redis]
  beat:
    build: ./backend
    command: celery -A app.worker.celery beat --loglevel=info
    restart: unless-stopped
    mem_limit: 160m
    environment:
      DATABASE_URL: postgresql+psycopg2://auction:${POSTGRES_PASSWORD:-auction-change-me}@postgres:5432/auction
      REDIS_URL: redis://redis:6379/0
      EUR_AED_RATE: ${EUR_AED_RATE:-4.30}
    depends_on: [backend, redis]
  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 64m
    ports: ["127.0.0.1:8087:80"]
    depends_on: [backend]
volumes: {postgres_data: {}}
